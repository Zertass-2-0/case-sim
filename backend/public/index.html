<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar" hidden>
    <div class="brand">CASE<span>SIM</span></div>
    <nav id="tabs"></nav>

      <span id="nick"></span>
      <span class="coins" id="balance"></span>
      <button id="logout" class="ghost">Log out</button>

  <main id="app"></main>

  <div id="toast" hidden></div>
  <div id="modal" hidden></div>

  <footer>Unofficial fan-made practice project. Virtual coins only, no real money. Not affiliated with Valve. Skin names and images belong to their owners.</footer>
  <script src="app.js"></script>
</body>
</html>
